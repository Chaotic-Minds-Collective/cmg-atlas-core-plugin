name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atlas_core_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_core_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_core_test
      STEAM_OPENID_RETURN_URL: https://www.chaoticmindsgaming.com/api/account/link/steam/callback
      STRIPE_WEBHOOK_SECRET: whsec_ci_wallet_test_secret_2026_11_18
      STEAM_OPENID_RETURN_URL: https://www.chaoticmindsgaming.com/api/account/link/steam/callback
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Test
        run: npm test
